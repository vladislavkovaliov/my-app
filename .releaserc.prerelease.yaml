plugins:
    - - '@semantic-release/commit-analyzer'
      - preset: conventionalcommits
    - - '@semantic-release/release-notes-generator'
      - preset: conventionalcommits
        presetConfig:
            types:
                - type: feat
                  section: Features
                - type: fix
                  section: Fixes
                - type: perf
                  section: Performance Improvements
                - type: revert
                  section: Reverts
                - type: docs
                  section: Documentation
                - type: style
                  section: Styles
                - type: chore
                  section: Chores
                - type: refactor
                  section: Code Refactoring
                - type: test
                  section: Tests
                - type: build
                  section: Build
                - type: ci
                  section: CI/CD
        writerOpts:
            commitPartial: '* {{header}}{{#if hash}} ({{shortHash}}){{/if}}'
    - '@semantic-release/changelog'
    - - '@semantic-release/npm'
      - npmPublish: false
    - - '@semantic-release/git'
      - assets:
            - CHANGELOG.md
            - package.json
            - package-lock.json
    - '@semantic-release/github'

branches:
    - '+([0-9])?(.{+([0-9]),x}).x'
    - main
    - name: dev/*
      prerelease: '${name.replace(/^dev\//g, "dev-")}'
    - name: feature/*
      prerelease: '${name.replace(/^feature\//g, "feature-")}'
    - name: hotfix/*
      prerelease: '${name.replace(/^hotfix\//g, "hotfix-")}'
